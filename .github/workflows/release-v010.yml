name: v0.1.0 evidence assets

on:
  workflow_dispatch:
  push:
    tags:
      - v0.1.0

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv and locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.10.10
          uv sync --frozen --extra dev

      - name: Test before packaging
        run: uv run pytest -q

      - name: Build wheel and source distribution
        run: uv build --no-build-isolation --wheel --sdist --out-dir dist

      - name: Clean-install wheel smoke
        run: |
          clean_env="$RUNNER_TEMP/clean-env"
          uv venv "$clean_env"
          uv pip install --python "$clean_env/bin/python" --no-deps dist/*.whl
          "$clean_env/bin/python" -c "import src.api.security"

      - name: Generate locked SBOM and checksums
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/requirements.lock.txt"
          set +e
          uv run pip-audit -r "$RUNNER_TEMP/requirements.lock.txt" --no-deps --disable-pip --format cyclonedx-json --output dist/sbom.cdx.json
          audit_status=$?
          set -e
          test -s dist/sbom.cdx.json
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning::pip-audit reported locked dependency advisories; SBOM was still generated"
          fi
          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload evidence assets only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fraud-v0.1.0-evidence-${{ github.sha }}
          path: dist/
          if-no-files-found: error
