name: Reproducible fraud baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fraud-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.10.10

      - name: Install locked development environment
        run: uv sync --frozen --extra dev

      - name: Verify provenance and redacted secret scan
        run: |
          uv run python scripts/check_provenance.py
          uv run python scripts/secret_scan.py

      - name: Run characterization tests
        run: uv run pytest -q

      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run mypy src tests --ignore-missing-imports

      - name: Audit exported lock
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/requirements.lock.txt"
          # PR1 records the locked audit output; model/runtime advisories are
          # not silently treated as fixed by a source-only baseline.
          uv run pip-audit -r "$RUNNER_TEMP/requirements.lock.txt" --no-deps --disable-pip || {
            echo "::warning::locked dependency advisories are recorded by CI; resolve in a dependency-focused follow-up"
          }

      - name: Build wheel and sdist, then clean-install wheel
        run: |
          uv build --no-build-isolation --wheel --sdist --out-dir dist
          clean_env="$RUNNER_TEMP/clean-env"
          uv venv "$clean_env"
          uv pip install --python "$clean_env/bin/python" --no-deps dist/*.whl
          "$clean_env/bin/python" -c "import src.api.security"
          "$clean_env/bin/python" -m compileall -q src

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Compose topology without broker
        env:
          FRAUD_PRODUCER_SECRETS_JSON: '{"ci-producer":"ci-secret"}'
          GF_SECURITY_ADMIN_PASSWORD: ci-password
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.local.yml config --quiet

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build API image from pinned base
        run: docker build --file docker/api.dockerfile --tag fraud-baseline-api:${{ github.sha }} .

      - name: Build worker image from pinned CUDA base
        run: docker build --file docker/worker.dockerfile --tag fraud-baseline-worker:${{ github.sha }} .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv and locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.10.10
          uv sync --frozen --extra dev

      - name: Prove signed API to worker result flow with real Redpanda
        run: uv run python scripts/e2e_redpanda.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Always clean E2E broker
        if: ${{ always() }}
        run: docker compose -p fraud-pr2-e2e -f infra/docker-compose.e2e.yml down -v --remove-orphans
