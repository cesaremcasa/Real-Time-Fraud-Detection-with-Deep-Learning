version: '3.8'

services:
  # Message Broker
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1@sha256:632ee5289856bd0d56612f8ab13266851834552ceb37511eea9f2401e3d4616f
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --set redpanda.enable_transactions=true
      - --set redpanda.enable_idempotence=true
      - --set redpanda.default_topic_partitions=1
      - --kafka-addr PLAINTEXT://0.0.0.0:29092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - fraud-detection-net

  # Monitoring: Prometheus
  prometheus:
    image: prom/prometheus:v2.55.1@sha256:b1935d181b6dd8e9c827705e89438815337e1b10ae35605126f05f44e5c6940f
    container_name: prometheus
    volumes:
          - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - fraud-detection-net

  # Monitoring: Grafana
  grafana:
    image: grafana/grafana:11.4.0@sha256:8d938a1c52b018c60cb3583657e038054387aa18a74f09a865c99a522481f7ac
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set this before starting the stack}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - fraud-detection-net

  # API Producer
  api-producer:
    build:
      context: ..
      dockerfile: docker/api.dockerfile
    container_name: api-producer
    volumes:
      - ../data:/app/data:ro
      - ../artifacts:/app/artifacts:ro
    environment:
      - REDPANDA_BROKERS=redpanda:29092
      - KAFKA_TOPIC=fraud-transactions
      - FRAUD_PRODUCER_SECRETS_JSON=${FRAUD_PRODUCER_SECRETS_JSON:?set at least one HMAC producer secret before starting the stack}
    depends_on:
      - redpanda
    networks:
      - fraud-detection-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ML Worker com suporte a GPU
  ml-worker:
    build:
      context: ..
      dockerfile: docker/worker.dockerfile
    container_name: ml-worker
    volumes:
      - ../data:/app/data:ro
      - ../artifacts:/app/artifacts:ro
    environment:
      - REDPANDA_BROKERS=redpanda:29092
      - KAFKA_TOPIC=fraud-transactions
      - KAFKA_CONSUMER_GROUP=ml-workers
    depends_on:
      - redpanda
      - api-producer
    networks:
      - fraud-detection-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

networks:
  fraud-detection-net:
    driver: bridge

volumes:
  redpanda_data:
  grafana_data:
